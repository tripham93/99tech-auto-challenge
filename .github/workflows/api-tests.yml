name: API Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --include=dev
      - name: Run API tests
        run: npm run test:api
        env:
          API_URL: ${{ vars.API_URL || 'https://api.demoblaze.com' }}
          DEMOBLAZE_USERNAME: ${{ secrets.DEMOBLAZE_USERNAME }}
          DEMOBLAZE_PASSWORD: ${{ secrets.DEMOBLAZE_PASSWORD }}
      - name: Build Allure report
        if: always() && hashFiles('allure-results/**/*') != ''
        run: npm run report:allure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: |
            playwright-report/
            allure-results/
            allure-report/
            test-results/
          retention-days: 14