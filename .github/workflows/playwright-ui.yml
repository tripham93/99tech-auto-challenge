name: Playwright UI Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-ui:
    name: Playwright UI (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - name: Run UI tests
        run: npm run test:ui -- --project=chromium
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://www.demoblaze.com' }}
          DEMOBLAZE_USERNAME: ${{ secrets.DEMOBLAZE_USERNAME }}
          DEMOBLAZE_PASSWORD: ${{ secrets.DEMOBLAZE_PASSWORD }}
      - name: Build Allure report
        if: always() && hashFiles('allure-results/**/*') != ''
        run: npm run report:allure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-ui-reports
          path: |
            playwright-report/
            allure-results/
            allure-report/
            test-results/
          retention-days: 14